<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lasso Blobs VR</title>
<style>
:root{--pn:rgba(255,255,255,.9);--fg:#14162a;--ac:#2a6df4;--bd:rgba(0,0,0,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pn:rgba(20,22,45,.9);--fg:#eef;--ac:#7cf;--bd:rgba(255,255,255,.22)}}
:root[data-theme=dark]{--pn:rgba(20,22,45,.9);--fg:#eef;--ac:#7cf;--bd:rgba(255,255,255,.22)}
html,body{height:100%;margin:0;overflow:hidden;background:#12142a;font:14px system-ui,sans-serif}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#ui>*{pointer-events:auto}
.bar{display:flex;gap:4px;align-items:center;background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:4px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 10px;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
#cols i{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}
#cols i.on{border-color:var(--fg)}
#hint{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);color:#dde;text-align:center;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
</style></head><body>
<div id="ui"><div class="bar" id="modes"></div><div class="bar" id="cols"></div>
<div class="bar"><button id="vr">Enter VR</button><button id="clr">Clear</button></div></div>
<div id="hint"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id);
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.xr.enabled=true;document.body.prepend(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x12142a);
const cam=new T.PerspectiveCamera(60,1,.02,100);S.add(cam);
S.add(new T.HemisphereLight(0xffffff,0x334466,.95));
const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(2,4,3);S.add(dl);
S.add(new T.GridHelper(10,40,0x4466aa,0x223355));
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

const cols=[0xff5a6e,0xffb84d,0xf5e663,0x5fd88a,0x4dc4ff,0x8a7dff,0xff7ad9,0xf2f2f2];
const modes=['draw','grab','merge','split','del'];
const names={draw:'Draw',grab:'Grab',merge:'Merge',split:'Split',del:'Delete'};
const hints={
 draw:'Hold trigger / left mouse and draw a closed loop in the air. Release to fill it into a 3D shape.',
 grab:'Point at a shape and hold trigger / drag to move it. Thumbstick up-down or mouse wheel scales it.',
 merge:'Pick one shape, then another: they fuse into one object that moves together.',
 split:'Pick a part of a merged object to pull it back out.',
 del:'Pick a shape to delete it.'};
const hex=c=>'#'+c.toString(16).padStart(6,'0');
let ci=4,mode='draw',sel=null,note='',nt;
const meshes=[];

// ---------- UI ----------
modes.forEach(m=>{const b=document.createElement('button');b.id='m_'+m;b.textContent=names[m];b.onclick=()=>setMode(m);$('modes').appendChild(b)});
cols.forEach((c,i)=>{const s=document.createElement('i');s.style.background=hex(c);s.onclick=()=>setColor(i);$('cols').appendChild(s)});
function setMode(m){mode=m;if(sel){glow(sel,false);sel=null}modes.forEach(x=>$('m_'+x).classList.toggle('on',x===m));$('hint').textContent=hints[m];drawLabel()}
function setColor(i){ci=i;[...$('cols').children].forEach((e,j)=>e.classList.toggle('on',j===i));drawLabel()}
function flash(m){note=m;drawLabel();$('hint').textContent=m;clearTimeout(nt);nt=setTimeout(()=>{note='';drawLabel();$('hint').textContent=hints[mode]},2200)}
$('clr').onclick=()=>{new Set(meshes.map(root)).forEach(del);sel=null};
addEventListener('keydown',e=>{const i='12345'.indexOf(e.key);if(i>=0)setMode(modes[i]);if(e.key==='c')setColor((ci+1)%cols.length)});

// VR wrist label (left controller)
const lc=document.createElement('canvas');lc.width=256;lc.height=128;
const lx=lc.getContext('2d'),ltex=new T.CanvasTexture(lc);
const lab=new T.Mesh(new T.PlaneGeometry(.12,.06),new T.MeshBasicMaterial({map:ltex,transparent:true}));
lab.position.set(0,.07,.04);lab.rotation.x=-.6;
function drawLabel(){lx.clearRect(0,0,256,128);lx.fillStyle='rgba(15,18,40,.9)';lx.fillRect(0,0,256,128);
 lx.fillStyle=hex(cols[ci]);lx.fillRect(0,0,256,16);lx.fillStyle='#fff';lx.font='bold 46px sans-serif';lx.fillText(names[mode],14,72);
 lx.font='19px sans-serif';lx.fillText(note||'A/X mode  B/Y color',14,108);ltex.needsUpdate=true}

// ---------- helpers ----------
const rc=new T.Raycaster();
function root(o){while(o.parent&&o.parent!==S)o=o.parent;return o}
function glow(r,on){r.traverse(o=>{if(o.isMesh)o.material.emissive.setHex(on?0x445566:0)})}
function pick(ray){S.updateMatrixWorld(true);rc.ray.copy(ray);rc.far=Infinity;return rc.intersectObjects(meshes,false)[0]}
function scl(o,f){const s=o.scale.x*f;if(s>.15&&s<8)o.scale.multiplyScalar(f)}
function mkLine(){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(4500),3));g.setDrawRange(0,0);
 const l=new T.LineLoop(g,new T.LineBasicMaterial({color:0xffffff}));l.frustumCulled=false;l.visible=false;S.add(l);return l}

// ---------- lasso fill: loop -> puffy 3D solid ----------
function fill(pts,col=cols[ci]){
 const P=[];pts.forEach(p=>{if(!P.length||p.distanceTo(P[P.length-1])>.015)P.push(p)});
 if(P.length<6){flash('Loop too small');return}
 const c=new T.Vector3();P.forEach(p=>c.add(p));c.divideScalar(P.length);
 const n=new T.Vector3();
 for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];n.x+=(a.y-b.y)*(a.z+b.z);n.y+=(a.z-b.z)*(a.x+b.x);n.z+=(a.x-b.x)*(a.y+b.y)}
 if(n.length()<1e-6){flash('Draw a loop, not a line');return}
 n.normalize();
 const u=new T.Vector3(0,1,0).cross(n);if(u.lengthSq()<.01)u.set(1,0,0).cross(n);u.normalize();
 const v=n.clone().cross(u);
 let w=0;
 const q=P.map(p=>{const d=p.clone().sub(c),x=d.dot(u),y=d.dot(v);w=Math.max(w,Math.hypot(x,y));return new T.Vector2(x,y)});
 if(w<.03){flash('Loop too small');return}
 const sh=new T.Shape(q),dep=w*.2;
 let geo=null;
 for(const k of [1,.4,0]){
  try{const g=new T.ExtrudeGeometry(sh,{depth:dep,curveSegments:1,bevelEnabled:k>0,bevelThickness:w*.3*k,bevelSize:w*.22*k,bevelOffset:-w*.22*k,bevelSegments:5});
   if(!g.attributes.position.array.some(isNaN)){geo=g;break}}catch(e){}
 }
 if(!geo){flash('Could not fill that loop');return}
 geo.translate(0,0,-dep/2);
 const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:col,roughness:.45,metalness:.05,side:T.DoubleSide}));
 m.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(u,v,n));
 m.position.copy(c);m.userData.t=0;m.scale.setScalar(.01);
 S.add(m);meshes.push(m);
}

// ---------- merge / split / delete ----------
function merge(a,b){
 let g=a.isMesh?null:a;
 if(!g){g=new T.Group();g.position.copy(a.position);S.add(g);g.attach(a)}
 const col=g.children[0].material.color.getHex();
 if(b.isMesh)g.attach(b);else{b.children.slice().forEach(c=>g.attach(c));S.remove(b)}
 g.children.forEach(m=>{m.material.color.setHex(col);m.userData.t=1});
 flash('Merged: '+g.children.length+' parts');
}
function split(m){
 const g=m.parent;
 if(!g||g===S){flash('Nothing to split. Merge first.');return}
 const o=new T.Vector3();
 g.children.forEach(c=>{if(c!==m)o.add(c.getWorldPosition(new T.Vector3()))});
 o.divideScalar(Math.max(1,g.children.length-1));
 const d=m.getWorldPosition(new T.Vector3()).sub(o);
 if(d.length()<.01)d.set(0,1,0);d.normalize();
 S.attach(m);m.position.addScaledVector(d,.15);
 if(g.children.length===1){S.attach(g.children[0]);S.remove(g)}else if(!g.children.length)S.remove(g);
 flash('Separated');
}
function del(r){r.traverse(o=>{const i=meshes.indexOf(o);if(i>=0){meshes.splice(i,1);o.geometry.dispose()}});S.remove(r)}

// ---------- pointers (VR controllers + desktop mouse) ----------
function addPt(p,t){const s=p.stroke;if(s.length>=1500)return;s.push(t);
 const a=p.line.geometry.attributes.position;a.setXYZ(s.length-1,t.x,t.y,t.z);a.needsUpdate=true;
 p.line.geometry.setDrawRange(0,s.length);p.line.visible=s.length>1}
function grab(p,r,pt){
 glow(r,true);
 if(p.node)p.node.attach(r);
 else{p.gp=new T.Plane().setFromNormalAndCoplanarPoint(cam.getWorldDirection(new T.Vector3()),pt);p.off=r.position.clone().sub(pt)}
 p.hold=r}
function drop(p){if(p.node)S.attach(p.hold);glow(p.hold,false);p.hold=null}
function down(p){
 if(mode==='draw'){p.stroke=[];p.line.material.color.setHex(cols[ci]);addPt(p,p.tip());return}
 const h=pick(p.ray());if(!h)return;
 const r=root(h.object);
 if(mode==='grab')grab(p,r,h.point);
 else if(mode==='del')del(r);
 else if(mode==='split')split(h.object);
 else if(mode==='merge'){
  if(!sel){sel=r;glow(r,true)}
  else if(sel===r){glow(r,false);sel=null}
  else{const a=sel;glow(a,false);sel=null;merge(a,r)}
 }
}
function up(p){
 if(p.stroke){const s=p.stroke;p.stroke=null;p.line.visible=false;fill(s)}
 if(p.hold)drop(p);
}

const ptrs=[];
function mkVR(i){
 const c=R.xr.getController(i);S.add(c);
 const p={node:c,hold:null,stroke:null,line:mkLine()};
 const tip=new T.Mesh(new T.SphereGeometry(.012,12,8),new T.MeshBasicMaterial({color:0xffffff}));tip.position.z=-.06;c.add(tip);p.tipM=tip;
 p.rl=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,-.06),new T.Vector3(0,0,-3)]),new T.LineBasicMaterial({color:0x88ccff,transparent:true,opacity:.5}));c.add(p.rl);
 p.tip=()=>{c.updateMatrixWorld();return c.localToWorld(new T.Vector3(0,0,-.06))};
 p.ray=()=>{c.updateMatrixWorld();return new T.Ray(c.getWorldPosition(new T.Vector3()),new T.Vector3(0,0,-1).applyQuaternion(c.getWorldQuaternion(new T.Quaternion())))};
 c.addEventListener('connected',e=>{p.src=e.data;if(e.data.handedness==='left')c.add(lab)});
 c.addEventListener('disconnected',()=>{p.src=null});
 c.addEventListener('selectstart',()=>down(p));
 c.addEventListener('selectend',()=>up(p));
 ptrs.push(p)}
mkVR(0);mkVR(1);

const dp={node:null,hold:null,stroke:null,line:mkLine(),ndc:new T.Vector2(),tgt:new T.Vector3(0,1.2,-1)};
dp.ray=()=>{cam.updateMatrixWorld();rc.setFromCamera(dp.ndc,cam);return rc.ray.clone()};
dp.tip=()=>{const t=new T.Vector3();return dp.ray().intersectPlane(new T.Plane().setFromNormalAndCoplanarPoint(cam.getWorldDirection(new T.Vector3()),dp.tgt),t)||t.copy(dp.tgt)};
let yaw=0,pol=1.4,dist=2.4,orb=false,ox=0,oy=0;
function updCam(){const t=dp.tgt;cam.position.set(t.x+dist*Math.sin(pol)*Math.sin(yaw),t.y+dist*Math.cos(pol),t.z+dist*Math.sin(pol)*Math.cos(yaw));cam.lookAt(t);cam.updateMatrixWorld()}
const cv=R.domElement,setN=e=>dp.ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);setN(e);if(e.button===2||e.shiftKey){orb=true;ox=e.clientX;oy=e.clientY}else if(e.button===0)down(dp)};
cv.onpointermove=e=>{setN(e);if(orb){yaw-=(e.clientX-ox)*.006;pol=Math.min(2.6,Math.max(.4,pol-(e.clientY-oy)*.006));ox=e.clientX;oy=e.clientY}};
cv.onpointerup=e=>{orb=false;if(e.button===0)up(dp)};
cv.onwheel=e=>{e.preventDefault();if(dp.hold)scl(dp.hold,e.deltaY<0?1.08:.93);else dist=Math.min(8,Math.max(.8,dist*(1+e.deltaY*.001)))};

// ---------- VR button ----------
const vb=$('vr');
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
 if(ok)vb.onclick=()=>navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']}).then(s=>R.xr.setSession(s));
 else{vb.textContent='VR unavailable';vb.disabled=true}}).catch(()=>{vb.textContent='VR unavailable';vb.disabled=true})}
else{vb.textContent='VR unavailable';vb.disabled=true}

// ---------- main loop ----------
let last=0;const tmp=new T.Vector3();
R.setAnimationLoop(t=>{
 const dt=Math.min(.05,(t-last)/1000);last=t;
 const xr=R.xr.isPresenting;
 if(!xr)updCam();
 ptrs.forEach(p=>{
  const g=p.src&&p.src.gamepad;
  if(g){
   const a=g.buttons[4]&&g.buttons[4].pressed,b=g.buttons[5]&&g.buttons[5].pressed;
   if(a&&!p.a)setMode(modes[(modes.indexOf(mode)+1)%modes.length]);p.a=a;
   if(b&&!p.b)setColor((ci+1)%cols.length);p.b=b;
   const y=g.axes[3]||0;if(p.hold&&Math.abs(y)>.2)scl(p.hold,1-y*dt);
  }
  p.rl.visible=mode!=='draw';p.tipM.material.color.setHex(mode==='draw'?cols[ci]:0xffffff);
 });
 (xr?ptrs:[dp]).forEach(p=>{
  if(p.stroke){const t=p.tip();if(t.distanceTo(p.stroke[p.stroke.length-1])>.012)addPt(p,t)}
  if(!xr&&p.hold&&p.gp&&p.ray().intersectPlane(p.gp,tmp))p.hold.position.copy(tmp.add(p.off));
 });
 meshes.forEach(m=>{if(m.userData.t<1&&m.parent===S){const k=m.userData.t=Math.min(1,m.userData.t+dt*3),e=k-1;m.scale.setScalar(Math.max(.01,1+2.70158*e*e*e+1.70158*e*e))}});
 R.render(S,cam);
});

// ---------- start ----------
setMode('draw');setColor(4);
const circ=(x,y,r)=>Array.from({length:28},(_,i)=>new T.Vector3(x+r*Math.cos(i/28*6.283),y+r*Math.sin(i/28*6.283),-1));
fill(circ(-.25,1.2,.18),0x4dc4ff);fill(circ(.1,1.3,.14),0xff7ad9);
</script></body></html>
